[package]
name = "mini_midi_synth"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = { version = "0.15", features = ["jack"] }
midir = "0.10"
wmidi = "4"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Dev builds: optimize deps so audio doesn't glitch during development
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
